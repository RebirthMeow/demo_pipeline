// mme/autoexec.cfg — belt-and-suspenders override for capture pipeline.
// Loaded AFTER base/autoexec.cfg and AFTER mme/jampconfig.cfg, so these win.
// DO NOT put gameplay binds here — base/autoexec.cfg owns those.

// renderer + windowed mode (defeat fullscreen takeover)
seta cl_renderer "rd-jamme"
seta r_fullscreen "0"
seta r_noborder "0"
seta r_centerWindow "1"
seta r_mode "-1"
seta r_customwidth "1280"
seta r_customheight "720"

// keep it ugly-but-working — FBO + MSAA broke on this driver
seta r_fbo "0"
seta r_DynamicGlow "0"

// demo batch behavior
seta mme_demoListQuit "1"
seta mme_demoAutoQuit "1"
seta mme_demoEscapeQuit "1"
seta mme_demoConvert "1"
seta mme_demoPrecache "0"

// capture pipe — ffmpeg consumes raw avi from stdin, writes %o.mp4
seta mme_pbo "1"
seta mme_pipeCommand "ffmpeg -f avi -i - -threads 0 -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -y %o.mp4 2> ffmpeglog.txt"

// misc
seta cg_deferplayers "0"

// HUD / camera / radar
seta cg_hudFiles "1"
seta cg_thirdPerson "1"
seta cg_drawRadar "0"
seta cg_speedTrail "0"
seta cg_drawTimer "1"
