
bind    w        +forward
bind    s        +back
bind    a        +moveleft
bind    d        +moveright
bind    ctrl     +movedown
bind    space    +moveup

bind    q        "edit prev"
bind    e        "edit next"
bind    r        "edit lock"
bind    v        "edit add"
bind    b        "edit del"
bind    t        "edit start"
bind    g        "edit end"
bind    f        "edit target"

bind    mouse1   +attack
bind    mouse2   +altattack
bind    shift    +seek
bind    mouse3   hudToggle

bind    z        "view prev"
bind    x        "view next"
bind    c        "pause"

bind    1        "edit camera"
bind    2        "edit chase"
bind    3        "edit line"
bind    4        "edit dof"
bind    5        "edit script"
bind    6        "edit book"
bind    7        "edit none"

bind    [        "cut start"
bind    ]        "cut end"
bind    /        "cut it"

bind    -        "multispec clear"
bind    =        "multispec add"
bind    \        "multispec edit"

seta r_picmip "0"
seta cg_deferplayers "0"

// --- BATCH CAPTURE TRIGGER (auto-fires on every demo load) ---
echo BATCH starting capture pipe to ffmpeg
capture pipe 60 clip
